[platformio]
src_dir = main

[env:bella_esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
  -I include

[env:bella_esp32_st7789_240x240]
extends = env:bella_esp32
build_flags =
  ${env:bella_esp32.build_flags}
  -D BELLA_TFT_PROFILE=1

[env:bella_esp32_ili9341_240x320]
extends = env:bella_esp32
build_flags =
  ${env:bella_esp32.build_flags}
  -D BELLA_TFT_PROFILE=2

[env:bella_esp32_st7735_128x160]
extends = env:bella_esp32
build_flags =
  ${env:bella_esp32.build_flags}
  -D BELLA_TFT_PROFILE=3

[env:bella_esp32_touch4_ptt_momentary]
extends = env:bella_esp32
build_flags =
  ${env:bella_esp32.build_flags}
  -D BELLA_TOUCH4_PTT_ENABLED=1

