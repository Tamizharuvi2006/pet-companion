[platformio]
src_dir = main

[env:bella_esp32_cam]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
  -I include

[env:bella_esp32_cam_ai_thinker]
extends = env:bella_esp32_cam
build_flags =
  ${env:bella_esp32_cam.build_flags}
  -D BELLA_CAM_PROFILE_AI_THINKER=1

